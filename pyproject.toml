[project]
name = "llm-inference-gateway"
version = "0.1.0"
description = "SLO-aware OpenAI-compatible LLM inference gateway with a capacity planner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]
cache = ["fastembed>=0.3", "faiss-cpu>=1.8"]
bench = ["datasets>=2.18", "matplotlib>=3.8", "pandas>=2.2"]

[tool.setuptools]
packages = ["bench", "gateway", "control", "perfmodel", "workloads", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E702", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
