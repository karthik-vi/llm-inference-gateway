# NOT VERIFIED IN THIS ENVIRONMENT (no usable Docker daemon). Run `make download` first (./models is mounted).
services:
  replica0: &replica
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "-t", "2", "-np", "4", "-c", "4096",
              "--cont-batching", "--cache-prompt", "--metrics", "--host", "0.0.0.0", "--port", "8080"]
    volumes: ["../models:/models:ro"]
    cpus: 2
  replica1:
    <<: *replica
  gateway:
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment: {GATEWAY_CONFIG: /cfg/config.yaml, OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4317"}
    volumes: ["./config.compose.yaml:/cfg/config.yaml:ro"]
    ports: ["8080:8080"]
    depends_on: [replica0, replica1]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  otel:
    image: otel/opentelemetry-collector:0.104.0
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    command: ["--config=/etc/otelcol/config.yaml"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    volumes: ["./grafana:/var/lib/grafana/dashboards:ro"]
